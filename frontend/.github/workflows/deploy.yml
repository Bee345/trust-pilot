name: Deploy to Production

on:
  push:
    branches: [main]

# Only run one deployment at a time
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  # ─── JOB 1: Deploy Frontend to Vercel ───────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend for production
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./

  # ─── JOB 2: Deploy Backend to Railway ───────────────────────────────────────
  deploy-backend:
    name: Deploy Backend to Railway
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service trustbase-backend
        working-directory: ./backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ─── JOB 3: Post-deploy health check ────────────────────────────────────────
  health-check:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-backend]

    steps:
      - name: Wait for backend to start
        run: sleep 30

      - name: Check backend health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.VITE_API_URL }}/health)
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed! Status: $STATUS"
            exit 1
          fi
          echo "Backend health check passed! Status: $STATUS"

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment health check FAILED for commit ${{ github.sha }}"
          echo "Check Railway logs immediately"

sonar.projectKey=trustbase
sonar.projectName=TrustBase
sonar.organization=bee345

# Source code locations
sonar.sources=src,backend/src

# Test locations
sonar.tests=backend/src/__tests__

# Files to exclude from analysis
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.js,**/__tests__/**,**/coverage/**

# Coverage report location (generated by Jest --coverage)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Files to exclude from coverage calculation
sonar.coverage.exclusions=**/*.test.js,**/config/**,**/sockets/**

# Block PR merges if quality gate fails
sonar.qualitygate.wait=true
